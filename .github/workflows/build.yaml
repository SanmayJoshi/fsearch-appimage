name: Build and Release AppImage

on:
  schedule:
    - cron: '0 0 * * *' # Check upstream daily at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger anytime
    inputs:
      force_build:
        description: 'Force build even if sha or versions match'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      has_builds: ${{ steps.check.outputs.has_builds }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
    steps:
      - name: Check upstream for new tags and commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          TARGETS='[]'

          # 1. Check upstream releases / tags
          # 
          UPSTREAM_TAG=$(gh api repos/cboxdoerfer/fsearch/releases/latest --jq .tag_name 2>/dev/null || echo "")
          if [ -n "$UPSTREAM_TAG" ] && [ "$UPSTREAM_TAG" != "null" ]; then
            # Check if this tag already exists as a release in YOUR repo
            LOCAL_TAG_RELEASE=$(gh release view "$UPSTREAM_TAG" --json id -q .id 2>/dev/null || echo "")

            if [ "$FORCE" = "true" ] || [ -z "$LOCAL_TAG_RELEASE" ]; then
              echo "Found new upstream stable release: $UPSTREAM_TAG"
              TARGETS=$(jq -c --arg tag "$UPSTREAM_TAG" '. += [{
                "build_type": "tag",
                "ref": $tag,
                "release_tag": $tag,
                "version_name": $tag,
                "prerelease": false,
                "title": ("FSearch " + $tag)
              }]' <<< "$TARGETS")
            else
              echo "Stable release $UPSTREAM_TAG is already built and published."
            fi
          fi

          # 2. Check upstream master branch (continuous)
          # 
          UPSTREAM_SHA=$(gh api repos/cboxdoerfer/fsearch/commits/master --jq .sha 2>/dev/null || echo "")
          if [ -n "$UPSTREAM_SHA" ] && [ "$UPSTREAM_SHA" != "null" ]; then
            RELEASE_SHA=$(gh release view continuous --json body -q .body 2>/dev/null \
              | grep -oP '(?<=cboxdoerfer/fsearch/commit/)[0-9a-f]{40}' || echo "")

            if [ "$FORCE" = "true" ] || [ "$UPSTREAM_SHA" != "$RELEASE_SHA" ]; then
              echo "Found new upstream continuous commit: $UPSTREAM_SHA"
              SHORT_SHA="${UPSTREAM_SHA:0:7}"
              TARGETS=$(jq -c --arg sha "$UPSTREAM_SHA" --arg ssha "$SHORT_SHA" '. += [{
                "build_type": "continuous",
                "ref": $sha,
                "release_tag": "continuous",
                "version_name": $ssha,
                "prerelease": true,
                "title": ("FSearch Continuous (" + $ssha + ")")
              }]' <<< "$TARGETS")
            else
              echo "Continuous release is up-to-date with upstream master."
            fi
          fi

          # 3. Set outputs
          # 
          TARGET_COUNT=$(jq '. | length' <<< "$TARGETS")
          if [ "$TARGET_COUNT" -gt 0 ]; then
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
            echo "build_matrix=$TARGETS" >> "$GITHUB_OUTPUT"
            echo "Scheduled builds: $TARGETS"
          else
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
            echo "No new releases or commits found. Skipping build."
          fi

  build-appimage:
    needs: check-upstream
    if: needs.check-upstream.outputs.has_builds == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check-upstream.outputs.build_matrix) }}

    env:
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - name: Checkout upstream FSearch
        uses: actions/checkout@v4
        with:
          repository: cboxdoerfer/fsearch
          ref: ${{ matrix.target.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git meson ninja-build itstool libtool \
            pkg-config intltool libicu-dev libpcre2-dev libglib2.0-dev \
            libgtk-3-dev libxml2-utils librsvg2-dev librsvg2-common \
            libgirepository1.0-dev file wget libfuse2 zsync

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O /usr/local/bin/linuxdeploy-plugin-appimage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O /usr/local/bin/linuxdeploy-plugin-gtk

          chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-appimage /usr/local/bin/linuxdeploy-plugin-gtk

      - name: Build and stage FSearch
        run: |
          meson setup builddir --prefix=/usr -Dbuildtype=release
          ninja -C builddir
          DESTDIR="$PWD/AppDir" ninja -C builddir install

      - name: Bundle AppImage
        run: |
          DESKTOP_FILE="AppDir/usr/share/applications/io.github.cboxdoerfer.FSearch.desktop"
          ICON_FILE="AppDir/usr/share/icons/hicolor/scalable/apps/io.github.cboxdoerfer.FSearch.svg"
          
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BUILD_TYPE="${{ matrix.target.build_type }}"
          VERSION_NAME="${{ matrix.target.version_name }}"

          # Continuous points to the 'continuous' tag; stable releases point to 'latest'
          if [ "$BUILD_TYPE" = "continuous" ]; then
            UPDATE_TAG="continuous"
          else
            UPDATE_TAG="latest"
          fi

          export UPDATE_INFORMATION="gh-releases-zsync|${REPO_OWNER}|${REPO_NAME}|${UPDATE_TAG}|FSearch-x86_64.AppImage.zsync"
          export LDAI_UPDATE_INFORMATION="$UPDATE_INFORMATION"
          export LDAI_OUTPUT="FSearch-x86_64.AppImage"
          export OUTPUT="FSearch-x86_64.AppImage"

          # 1. Package AppImage & create zsync
          linuxdeploy \
            --appdir AppDir \
            --desktop-file "$DESKTOP_FILE" \
            --icon-file "$ICON_FILE" \
            --plugin gtk \
            --output appimage

          # 2. Duplicate as version-named binary for direct download
          cp "FSearch-x86_64.AppImage" "FSearch-${VERSION_NAME}-x86_64.AppImage"

          # 3. Generate SHA256 checksums
          sha256sum "FSearch-x86_64.AppImage" > "FSearch-x86_64.AppImage.sha256"
          sha256sum "FSearch-${VERSION_NAME}-x86_64.AppImage" > "FSearch-${VERSION_NAME}-x86_64.AppImage.sha256"

      - name: Clean previous SHA-versioned assets (Continuous only)
        if: matrix.target.build_type == 'continuous'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove prior commit-specific assets from the continuous release to prevent indefinite storage accumulation
          OLD_ASSETS=$(gh release view continuous --json assets -q '.assets[].name' 2>/dev/null || true)
          for asset in $OLD_ASSETS; do
            if [[ "$asset" =~ ^FSearch-[0-9a-f]{7,40}-x86_64\. ]]; then
              echo "Removing previous continuous asset: $asset"
              gh release delete-asset continuous "$asset" -y || true
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.target.release_tag }}
          name: ${{ matrix.target.title }}
          prerelease: ${{ matrix.target.prerelease }}
          body: |
            Automated AppImage build tracking upstream `cboxdoerfer/fsearch`.

            - **Upstream Reference:** https://github.com/cboxdoerfer/fsearch/tree/${{ matrix.target.ref }}
            - **Architecture:** Linux x86_64

            ### Direct Download Links
            - [Latest AppImage (Static Link)](https://github.com/${{ github.repository }}/releases/download/${{ matrix.target.release_tag }}/FSearch-x86_64.AppImage)
            - [SHA256 Checksum](https://github.com/${{ github.repository }}/releases/download/${{ matrix.target.release_tag }}/FSearch-x86_64.AppImage.sha256)
          files: |
            FSearch-x86_64.AppImage
            FSearch-x86_64.AppImage.zsync
            FSearch-x86_64.AppImage.sha256
            FSearch-${{ matrix.target.version_name }}-x86_64.AppImage
            FSearch-${{ matrix.target.version_name }}-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
